<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160"><!-- A fine paper grain for the page background (David, 2026-10-16: texture). Mid-grey specks at about 5% strength, so it reads in both themes without changing text contrast. --><filter id="g" x="0" y="0"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .1 0"/></filter><rect width="160" height="160" filter="url(#g)"/></svg>
