<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"><!-- A coarse stone grain for tiles and chips, like fired clay or slate (David, 2026-10-20: earthy, texture oriented). Light and dark flecks at low strength, so text on the tile keeps its contrast. --><filter id="s" x="0" y="0"><feTurbulence type="fractalNoise" baseFrequency=".45" numOctaves="4" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .22 -.02"/></filter><rect width="200" height="200" filter="url(#s)"/></svg>
